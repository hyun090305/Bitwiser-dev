<!doctype html>
<html lang="ko"><meta charset="utf-8"><base href="/"><title>Hint progress and cooldown isolation</title>
<link rel="stylesheet" href="/style.css">
<button id="hintBtn">Hints</button>
<div id="hintModal" class="modal" style="display:none"><div class="modal-content hint-panel">
  <div id="hintButtons"></div><div id="hintMessage" hidden></div>
  <div id="hintTimerContainer"><span id="nextHintTimer"></span><button id="adHintBtn">Ad</button></div>
  <button id="closeHintBtn">Close</button>
</div></div>
<script>
  window.hintReads=[];window.hintWrites=[];window.hintTimers=new Set();
  window.hintServer={'hintProgress/hint-test/stage6':1};
  window.holdHintReads=false;window.holdHintTransactions=false;
  window.pendingHintReads=[];window.pendingHintTransactions=[];
  window.releaseHintReads=()=>pendingHintReads.splice(0).forEach(resolve=>resolve());
  window.releaseHintTransactions=(reverse=false)=>{
    const pending=pendingHintTransactions.splice(0);if(reverse)pending.reverse();pending.forEach(commit=>commit());
  };
  const db={ref:path=>({
    once:async()=>{
      hintReads.push(path);
      const value=hintServer[path]??(path.startsWith('hintLocks')?Date.now()+48*3600000:0);
      if(holdHintReads&&path.startsWith('hintProgress'))await new Promise(resolve=>pendingHintReads.push(resolve));
      return {val:()=>value};
    },
    set:async count=>{hintServer[path]=count;hintWrites.push({path,count,method:'set'});},
    transaction:update=>{
      // Firebase can start from an empty cache, then retry with the current server value.
      update(null);
      const commit=()=>{
        const count=update(hintServer[path]??null);hintServer[path]=count;
        hintWrites.push({path,count,method:'transaction'});
        return {committed:true,snapshot:{val:()=>count}};
      };
      return holdHintTransactions?new Promise(resolve=>pendingHintTransactions.push(()=>resolve(commit()))):Promise.resolve(commit());
    }
  })};
  window.firebase={auth:()=>({currentUser:{uid:'hint-test'}})};
  window.t=key=>key;
  const originalSet=window.setInterval,originalClear=window.clearInterval;
  window.setInterval=(...args)=>{const id=originalSet(...args);hintTimers.add(id);return id;};
  window.clearInterval=id=>{hintTimers.delete(id);originalClear(id);};
</script>
<script type="module">
  import {loadStageData} from '/src/modules/levels.js';
  import {initializeHintUI,openHintModal} from '/src/modules/hints.js';
  import {setHintProgress,setHintCooldown,getHintCooldown} from '/src/modules/storage.js';
  const lang=new URLSearchParams(location.search).get('lang')||'ko';window.currentLang=lang;document.documentElement.lang=lang;
  await loadStageData(lang);setHintProgress(6,0);setHintProgress(7,0);setHintProgress(25,0);
  setHintCooldown(Date.now()+24*3600000);window.initialCooldown=getHintCooldown();
  initializeHintUI();window.openTestHint=openHintModal;window.hintTestReady=true;
</script></html>
